name: 1c-metacode-lite

services:
  memgraph:
    image: memgraph/memgraph:latest
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    environment:
      - MEMGRAPH_ARGS=--memory-limit=512 --log-level=WARNING
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ── Example: single project ─────────────────────────────────────────
  # Copy this block and change PROJECT_NAME, ports, and volume path
  # for each 1C configuration you want to serve.

  1c-metacode-erp_main:
    image: svhov/1c-metacode-lite
    build: ./mcp-service
    restart: unless-stopped
    ports:
      - "6001:6001"
    volumes:
      - /path/to/erp_main:/app/data          # <-- set your local path
    environment:
      - PROJECT_NAME=erp_main
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MCP_PORT=6001
      - FULL_METADATA_RELOAD=true
      - LOAD_BSL_SIGNATURES=true
      - LOAD_FORMS_FROM_XML=true
      - LOAD_PREDEFINED_VALUES=true
      - LOAD_ROLE_RIGHTS=true
    depends_on:
      memgraph:
        condition: service_healthy

  # ── Add more projects below ─────────────────────────────────────────
  #
  # 1c-metacode-ssl3:
  #   image: svhov/1c-metacode-lite
  #   build: ./mcp-service
  #   restart: unless-stopped
  #   ports:
  #     - "6003:6001"
  #   volumes:
  #     - /path/to/ssl3:/app/data
  #   environment:
  #     - PROJECT_NAME=ssl3
  #     - MEMGRAPH_URI=bolt://memgraph:7687
  #     - MCP_PORT=6001
  #     - FULL_METADATA_RELOAD=true
  #   depends_on:
  #     memgraph:
  #       condition: service_healthy

volumes:
  memgraph_data:
    driver: local
